<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12110F" />
    <title>公司團購訂餐系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lunch-order-theme');
          if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#F7F4EE';
            document.documentElement.style.color = '#1F1B16';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F7F4EE');
          } else {
            document.documentElement.style.backgroundColor = '#12110F';
            document.documentElement.style.color = '#EFE9DE';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Noto Sans TC', system-ui, sans-serif;
          font-size: 14px;
          opacity: 0.7;
        "
      >
        載入訂餐系統中...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
